name: Release

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: peavers-warcraft/workflow-templates/.github/workflows/release.yml@master
    with:
      toc_file: PeaversCurrencyData.toc
      addon_name: PeaversCurrencyData
      git_user_name: Chris Turner
      git_user_email: peavers@gmail.com
      use_self_hosted: true
    secrets: inherit
