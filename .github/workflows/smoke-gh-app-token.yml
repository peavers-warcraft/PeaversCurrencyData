name: smoke-gh-app-token
on:
  workflow_dispatch:

permissions:
  id-token: write      # request the GitHub OIDC JWT
  contents: read

jobs:
  smoke:
    runs-on: warcraft-runners      # in-cluster self-hosted (Vault is internal-only)
    steps:
      - uses: peavers/.github/actions/gh-app-token@main
        id: t
      - name: Verify token works (no secret is printed)
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
        run: |
          echo "app-slug:        ${{ steps.t.outputs.app-slug }}"
          echo "installation-id: ${{ steps.t.outputs.installation-id }}"
          echo "API check (proves the token is live):"
          gh api /installation/repositories --jq '"installation can access \(.total_count) repos"'
